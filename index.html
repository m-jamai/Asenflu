<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ASENFLU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #050608;
      --fg: #f5f5f5;
      --muted: #9a9a9a;
      --accent: #e0b56f;
      --border: #22252b;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 18px 28px;
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
    }

    .logo {
      font-size: 1.1rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 18px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 24px;
      align-items: center;
    }

    .hero-cover {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: radial-gradient(circle at 10% 0%, #20232b 0, #050608 55%);
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-cover span {
      font-size: 0.9rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero-info {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hero-meta {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .hero-title {
      font-size: 1.6rem;
      font-weight: 500;
    }

    .hero-player {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-player label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    audio { width: 100%; outline: none; }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    .pill {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      display: inline-flex;
